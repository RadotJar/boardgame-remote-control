<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Control ( -_•)︻デ═一</title>
    <!-- 1. Load the Socket.IO client library from a CDN -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js" integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0" crossorigin="anonymous"></script>
</head>
<body>

    <h1>Laser Control ( -_•)︻デ═一</h1>
    <p>Status: <span id="status">Disconnected</span></p>
    
    <h2>Messages</h2>
    <p>Press some keys cobba</p>
    <div id="messages"></div>

    <script>
        // 2. Initialize the connection
        const SERVER_URL = "http://101.191.206.6:50002"; 
        const socket = io(SERVER_URL);

        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');

        const keyPresses = []
        let pressId = 1;

        // 3. Listen for connection success
        socket.on('connect', () => {
            statusEl.textContent = `Connected (ID: ${socket.id})`;
            statusEl.style.color = "green";
            socket.emit('i_am_web')
        });

        // 4. Listen for disconnection
        socket.on('disconnect', () => {
            statusEl.textContent = "Disconnected";
            statusEl.style.color = "red";
        });

        // 5. Send an event to the server when the button is clicked
        document.addEventListener('keydown', (event) => {
            const data = { pressId: pressId, key: event.key };
            socket.emit('key_press', data);
            logKeyPress(data.key);
            pressId++;
        });

        // 6. Listen for custom events broadcasted by the server
        socket.on('key_press_ack', (data) => {
            logKeyPressAck(data);
        });

        // Helper function to print logs on the screen
        function logKeyPress(key) {
            const p = document.createElement('p');
            p.textContent = `Sent keypress ${key} ... Awaiting ACK`;
            keyPresses.push( { pressId, element: p} )
            messagesEl.appendChild(p);
        }

        function logKeyPressAck(data) {
            const keyPress = keyPresses.find( keyPress => keyPress.pressId == data.pressId );
            const keyPressEl = keyPress.element;
            const existingText = keyPressEl.textContent.split('...')[0]
            keyPressEl.textContent = existingText + 'ACKED by laser'
        }
    </script>
</body>
</html>
